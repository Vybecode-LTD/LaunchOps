# Alembic: database migrations for LaunchOps. The app applies them at startup; to run them by hand:
#   python -m alembic upgrade head        apply every migration not yet applied
#   python -m alembic current             show the database's revision
#   python -m alembic revision -m "..."   start a new, hand-written migration in migrations/versions
# The database comes from DATABASE_URL (the environment or backend/.env), never from this file.

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
