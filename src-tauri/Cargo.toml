[package]
name = "vybecoding-launchops"
version = "1.0.0"
description = "VybeCod.ing Launch Operations — AI-Powered Launch Platform"
authors = ["VybeCod.ing"]
edition = "2021"

[lib]
name = "vybecoding_launchops_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
